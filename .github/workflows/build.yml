name: Build & Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      # The bridge logic is game-independent, so its tests run without Hollow Knight installed.
      - name: Restore
        run: dotnet restore tests/HKMP.SteamBridge.Tests

      - name: Test
        run: dotnet test tests/HKMP.SteamBridge.Tests -c Release --no-restore --verbosity normal
